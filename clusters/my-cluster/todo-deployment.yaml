apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        # --- VIKTIG: Flux endrer tagen på linjen under automatisk basert på kommentaren! ---
        image: iseeanoob/to-do-list:1.0.229 # {"$imagepolicy": "flux-system:todo-policy"}
        ports:
        - containerPort: 3001
        imagePullPolicy: Always
