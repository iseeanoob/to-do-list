name: Test and build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v5
      - name: Sett opp Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install
      - run: npm test